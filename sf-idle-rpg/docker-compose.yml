# Quest & Cudgel — one-command self-host stack: the game + its Postgres.
#
#   docker compose up --build              # → http://localhost:3000
#   APP_PORT=3001 docker compose up --build  # → http://localhost:3001
#
# Set APP_PORT if something else already uses 3000 on your machine. The app
# waits for Postgres to be healthy, applies migrations on start, then serves.
# Game data persists in the named volume across restarts.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: questcudgel
      POSTGRES_PASSWORD: questcudgel
      POSTGRES_DB: questcudgel
    volumes:
      - qc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questcudgel -d questcudgel"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # The app reaches Postgres over the compose network by service name.
      DATABASE_URL: postgresql://questcudgel:questcudgel@db:5432/questcudgel
      NODE_ENV: production
      # Optional: pin a key so Server Actions stay valid across restarts.
      # NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: change-me-to-a-base64-32-byte-string
    ports:
      # Host port is configurable (default 3000) so it won't clash with another
      # app already bound to 3000: `APP_PORT=3001 docker compose up`.
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qc-pgdata:
